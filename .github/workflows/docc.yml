name: Deploy DocC

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Package.swift"
      - ".github/pages/index.html"
      - ".github/workflows/docc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate symbol graph
        run: |
          mkdir -p .build/symbol-graphs

          swift build \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc .build/symbol-graphs

      - name: Build DocC
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          xcrun docc convert Sources/ZiweiKit/ZiweiKit.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path .build/ZiweiKit.doccarchive \
            --fallback-display-name ZiweiKit \
            --fallback-bundle-identifier dev.qiyang.ZiweiKit \
            --fallback-bundle-version 1.0 \
            --fallback-default-module-kind Library \
            --transform-for-static-hosting \
            --hosting-base-path "$REPOSITORY_NAME" \
            --source-service github \
            --source-service-base-url "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" \
            --checkout-path "$GITHUB_WORKSPACE" \
            --warnings-as-errors

      - name: Add documentation root redirect
        run: cp .github/pages/index.html .build/ZiweiKit.doccarchive/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/ZiweiKit.doccarchive

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ format('{0}documentation/ziweikit/', steps.deployment.outputs.page_url) }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
